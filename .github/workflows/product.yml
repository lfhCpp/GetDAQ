name: Original GET backend product
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3 qtbase5-dev libqt5svg5-dev qttools5-dev-tools openssl
      - name: Check supported product boundary
        run: python3 tools/verify-product-boundary.py
      - name: Build and stage original backend suite
        run: python3 tools/build-suite.py --profile full --jobs 2 --build-root build-ci --stage dist
      - name: Build current feature tests
        run: mkdir -p build-tests && cd build-tests && qmake ../tests/tests.pro && make -j2
      - name: Test GUI and SOAP lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: build-tests/getdaq-tests
      - name: Test original receiver bytes and SOAP service
        run: python3 tests/original_backends_payload_smoke.py dist/bin
      - name: Test master and worker process management
        run: python3 tests/original_backends_integration.py dist/bin tests/original_backends_fixture.py --evidence build-ci/evidence
      - name: Build unified project controller probe
        run: mkdir -p build-project-probe && cd build-project-probe && qmake ../tests/unified_project_controller_probe.pro && make -j2
      - name: Build log panel probe
        run: mkdir -p build-log-probe && cd build-log-probe && qmake ../tests/log_panel_probe.pro && make -j2
      - name: Test project directories, configuration delivery and shared monitoring
        run: python3 tests/unified_project_integration.py dist/bin --controller-probe build-project-probe/unified-project-controller-probe --log-panel-probe build-log-probe/log-panel-probe --evidence build-ci/project-evidence
      - name: Test read-only CoBo information window
        env:
          QT_QPA_PLATFORM: offscreen
        run: mkdir -p build-cobo-tests && cd build-cobo-tests && qmake ../tests/coboconnection.pro && make -j2 && ./cobo-connection-tests
      - name: Test direct read-only Ice queries
        run: |
          cmake -S third_party/ice-compat -B build-ci/full/native -DGETDAQ_BUILD_COBO_INFO_FIXTURE=ON
          cmake --build build-ci/full/native --parallel 2 --target cobo-info-fixture getdaq-cobo-info
          python3 tests/cobo_info_integration.py build-ci/full/native/getdaq-cobo-info build-ci/full/native/cobo-info-fixture
